<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131a"><meta name="description" content="JARVIS.IR AI assistant">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
<title>JARVIS.IR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.app{max-width:980px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:#10131aee;backdrop-filter:blur(12px);border-bottom:1px solid #242936;padding:14px 18px;display:flex;justify-content:space-between}
.brand{font-weight:800;font-size:20px}.status{font-size:12px;color:#8ee6a8}
main{flex:1;padding:20px 14px 110px}.welcome{text-align:center;margin:14vh auto 0}.welcome h1{font-size:36px;margin:0 0 10px}.welcome p{color:#aeb7c6}
.messages{display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:12px 15px;border-radius:18px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-start;background:#1d6fe8}.ai{align-self:flex-end;background:#171b23;border:1px solid #252b38}
.composer{position:fixed;bottom:0;left:0;right:0;background:#0b0d12ee;backdrop-filter:blur(14px);padding:12px;z-index:10}
.composer-inner{max-width:980px;margin:auto;display:flex;gap:8px;align-items:end;background:#171b23;border:1px solid #2a3140;border-radius:22px;padding:8px}
textarea{flex:1;resize:none;min-height:44px;max-height:140px;border:0;outline:0;background:transparent;color:white;padding:10px;font:inherit}
button{border:0;border-radius:15px;min-width:44px;height:44px;background:#242b38;color:white;cursor:pointer;font-size:18px}.send{background:#1d6fe8}.on{background:#b33a3a}.error{background:#35191d;border:1px solid #71343c}
.hint{text-align:center;font-size:11px;color:#70798a;margin-top:7px}@media(max-width:600px){.welcome h1{font-size:30px}.msg{max-width:92%}}
</style></head>
<body>
<div class="app">
<header><div class="brand">JARVIS.IR</div><div id="status" class="status">در حال اتصال…</div></header>
<main><section id="welcome" class="welcome"><h1>سلام، من JARVIS هستم</h1><p>سؤالت را بنویس یا با میکروفون صحبت کن. نسخهٔ رایگان با پاسخ‌های ساده.</p></section><section id="messages" class="messages"></section></main>
<div class="composer"><div class="composer-inner"><button id="mic">🎙️</button><textarea id="input" rows="1" placeholder="پیامت را بنویس…"></textarea><button id="send" class="send">➤</button></div><div class="hint">JARVIS.IR • حالت رایگان و ساده، بدون API</div></div>
</div>
<script>
const $=id=>document.getElementById(id), input=$("input"), list=$("messages"), welcome=$("welcome"), status=$("status"), send=$("send"), mic=$("mic");
const messages=[];
function add(role,text){welcome.style.display="none";const e=document.createElement("div");e.className="msg "+(role==="user"?"user":"ai");e.textContent=text;list.appendChild(e);e.scrollIntoView({behavior:"smooth"});}
function localReply(raw){
 const s=raw.trim().toLowerCase();
 const has=(...words)=>words.some(w=>s.includes(w));
 if(/^(hi|hello|hey|سلام|درود|سلام جارویس|سلام جارويس)[!.؟? ]*$/.test(s) || has("سلام جارویس","سلام جارويس"))
   return has("hello","hi","hey") && !has("سلام") ? "Hello! I'm JARVIS.IR. I can answer simple questions locally without an API key." : "سلام! من جارویس هستم 🤖 فعلاً در حالت رایگان و ساده کار می‌کنم. چه کمکی از دستم برمیاد؟";
 if(has("اسم تو چیه","اسمت چیه","تو کی هستی","who are you","your name"))
   return "من JARVIS.IR هستم؛ دستیار ساده‌ای که بدون کلید API کار می‌کنه.";
 if(has("چه کار","چیکار","چه کمکی","help","قابلیت"))
   return "می‌تونم به سلام و احوال‌پرسی، چند سؤال عمومی و محاسبات ساده جواب بدم. این نسخه از مدل هوش مصنوعی پیشرفته استفاده نمی‌کنه و جواب‌هام محدوده.";
 if(has("ممنون","مرسی","تشکر","thank you","thanks"))
   return "خواهش می‌کنم! هر وقت خواستی من اینجام. 🤖";
 if(has("خداحافظ","بای","فعلا","خدافظ","goodbye","bye"))
   return "خداحافظ! تا گفت‌وگوی بعدی. 👋";
 if(has("ساعت چنده","ساعت الان","what time is it","current time")){
   return "ساعت دستگاه شما: "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
 }
 if(has("امروز چندمه","تاریخ امروز","what is today's date","today's date")){
   return "تاریخ دستگاه شما: "+new Date().toLocaleDateString();
 }
 if(has("هوا چطوره","آب و هوا","weather"))
   return "در این نسخه به اینترنت و اطلاعات زندهٔ آب‌وهوا وصل نیستم؛ برای پیش‌بینی دقیق، برنامهٔ آب‌وهوا را بررسی کن.";
 if(has("جوک","joke"))
   return "چرا کامپیوتر خسته شد؟ چون تمام روز کار می‌کرد و هیچ‌وقت استراحت نمی‌گرفت! 😄";
 if(has("پایتخت ایران","capital of iran"))
   return "پایتخت ایران تهران است.";
 if(has("پایتخت فرانسه","capital of france"))
   return "پایتخت فرانسه پاریس است.";
 if(has("چطوری","حالت چطوره","خوبی","how are you"))
   return "ممنون که پرسیدی! من آماده‌ام کمکت کنم. تو چطوری؟";
 // Simple arithmetic: numbers and one arithmetic operator only.
 const m=s.match(/^\s*(-?\d+(?:\.\d+)?)\s*([+\-*/×÷])\s*(-?\d+(?:\.\d+)?)\s*[=?؟]?\s*$/);
 if(m){
   const a=Number(m[1]), b=Number(m[3]), op=m[2];
   if((op==="/"||op==="÷")&&b===0) return "تقسیم بر صفر تعریف نشده است.";
   const result=op==="+"?a+b:op==="-"?a-b:(op==="*"||op==="×")?a*b:a/b;
   return "جواب: "+result;
 }
 if(has("hello","hi","good morning","good evening"))
   return "Hello! I'm JARVIS.IR. This is the free basic mode, so I can answer only a limited set of questions.";
 if(has("capital of spain")) return "The capital of Spain is Madrid.";
 if(has("capital of usa","capital of the united states")) return "The capital of the United States is Washington, D.C.";
 return "هنوز جواب این سؤال رو بلد نیستم. 🧠 این نسخهٔ رایگان و ساده است و از مدل هوش مصنوعی پیشرفته استفاده نمی‌کنه. می‌تونی سؤال ساده‌تری بپرسی یا یک محاسبه مثل 12 * 4 بنویسی.";
}
function speak(text){
 if(!("speechSynthesis" in window)) return;
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=/[\u0600-\u06FF]/.test(text)?"fa-IR":"en-US";
 u.rate=1; window.speechSynthesis.speak(u);
}
async function health(){
 status.textContent="● حالت رایگان";
 status.title="پاسخ‌های ساده در همین مرورگر تولید می‌شوند؛ API لازم نیست.";
}
async function ask(){
 const text=input.value.trim();if(!text)return;
 input.value="";add("user",text);send.disabled=true;
 const load=document.createElement("div");load.className="msg ai";load.textContent="یک لحظه…";list.appendChild(load);
 try{
   await new Promise(resolve=>setTimeout(resolve,180));
   const reply=localReply(text);
   load.remove();messages.push({role:"user",content:text},{role:"assistant",content:reply});add("assistant",reply);speak(reply);
 }catch(e){load.className="msg ai error";load.textContent="پاسخ آماده نشد. دوباره امتحان کن."}
 finally{send.disabled=false;input.focus()}
}
send.onclick=ask;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.lang="fa-IR";rec.interimResults=false;rec.onstart=()=>mic.classList.add("on");rec.onend=()=>mic.classList.remove("on");rec.onresult=e=>{input.value=e.results[0][0].transcript;ask()};mic.onclick=()=>{try{rec.start()}catch{}}}
else mic.onclick=()=>alert("تشخیص گفتار در این مرورگر پشتیبانی نمی‌شود. می‌توانی پیام را تایپ کنی.");
health();
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
