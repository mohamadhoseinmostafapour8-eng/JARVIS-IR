<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131a"><meta name="description" content="JARVIS AI assistant">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
<title>JARVIS</title>
<style>
:root{color-scheme:dark;--bg:#080b13;--panel:#111827;--line:#27334a;--muted:#9aa9c2;--cyan:#65e4ff;--blue:#4b8cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#18365a 0,transparent 48%),radial-gradient(circle at 5% 70%,#10274666,transparent 28%),var(--bg);color:#f4f8ff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#7895bd12 1px,transparent 1px),linear-gradient(90deg,#7895bd12 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
.app{position:relative;max-width:1020px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:0 22px}
header{position:sticky;top:0;z-index:5;margin:0 -22px;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;background:#080d18d9;backdrop-filter:blur(18px);border-bottom:1px solid #26354c}
.header-actions{display:flex;align-items:center;gap:10px}.clear-chat{height:34px;min-width:0;padding:0 11px;border-radius:11px;font-size:11px;color:#c3d5ec;background:#172337;border:1px solid #344761}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:19px;letter-spacing:1.5px}.brand:before{content:"";width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#d9fbff 0 10%,#51dfff 13% 23%,#1765b9 28% 48%,#0c203e 53%);box-shadow:0 0 18px #42cfff99, inset 0 0 8px #b9f8ff}.status{font-size:12px;color:#91f0c0;background:#10271f;border:1px solid #24533d;padding:7px 11px;border-radius:99px}
main{flex:1;padding:24px 0 150px}.welcome{text-align:center;margin:10vh auto 42px;max-width:680px}.welcome:before{content:"AI • PERSONAL ASSISTANT";display:inline-block;color:var(--cyan);font-size:10px;letter-spacing:3px;font-weight:800;border:1px solid #3c7c9a66;background:#10283a99;padding:8px 14px;border-radius:99px;margin-bottom:22px}.welcome h1{font-size:clamp(32px,6vw,54px);line-height:1.25;margin:0 0 14px;font-weight:850;letter-spacing:-1px;background:linear-gradient(100deg,#fff 20%,#9eeeff 60%,#7ca7ff);color:transparent;background-clip:text}.welcome p{color:var(--muted);font-size:15px;line-height:2;margin:0 auto;max-width:520px}
.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px auto 0;max-width:690px}.suggestion{background:#101a2bba;border:1px solid #293b56;border-radius:16px;padding:14px 12px;color:#dceaff;font:inherit;font-size:13px;min-height:66px;cursor:pointer;transition:.2s}.suggestion:hover{border-color:#55c9f3;transform:translateY(-2px);background:#14263d}
.messages{display:flex;flex-direction:column;gap:15px;max-width:850px;margin:auto}.msg{max-width:82%;padding:13px 17px;border-radius:19px;line-height:1.95;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 24px #0002}.user{align-self:flex-start;background:linear-gradient(135deg,#2467c9,#2453a2);border:1px solid #6ba5ff55;border-bottom-left-radius:6px}.ai{align-self:flex-end;background:linear-gradient(145deg,#172337,#111a29);border:1px solid #2b405e;border-bottom-right-radius:6px}
.composer{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:16px 18px 12px;background:linear-gradient(transparent,#080b13 24%);backdrop-filter:blur(9px)}.composer-inner{max-width:850px;margin:auto;display:flex;gap:10px;align-items:end;background:#111b2b;border:1px solid #354968;border-radius:24px;padding:9px;box-shadow:0 12px 45px #0008,0 0 25px #1a7cb322;transition:border-color .2s}.composer-inner:focus-within{border-color:#5bcdf0;box-shadow:0 12px 45px #0008,0 0 0 3px #42cfff18}
textarea{flex:1;resize:none;min-height:46px;max-height:140px;border:0;outline:0;background:transparent;color:white;padding:11px 12px;font:inherit;font-size:14px}textarea::placeholder{color:#8292aa}
button{border:1px solid #344761;border-radius:16px;min-width:46px;height:46px;background:#1a2940;color:#eaf5ff;cursor:pointer;font-size:18px;transition:.2s}button:hover{filter:brightness(1.2);transform:translateY(-1px)}button:disabled{opacity:.5;cursor:wait;transform:none}.send{background:linear-gradient(135deg,#218de0,#385fe4);border-color:#5eabff}.on{background:#9d3545}.voice-active{border-color:#65e4ff;background:#12364a;color:#9cecff}.error{background:#35191d;border:1px solid #71343c}
.hint{text-align:center;font-size:10px;color:#71829d;margin-top:9px;letter-spacing:.3px}
@media(max-width:600px){.app{padding:0 13px}header{margin:0 -13px;padding:13px 16px}.welcome{margin:8vh auto 30px}.welcome h1{font-size:34px}.welcome p{font-size:13px}.suggestions{grid-template-columns:1fr;gap:8px}.suggestion{min-height:48px}.msg{max-width:94%;font-size:14px}.composer{padding:12px 10px 9px}}
</style></head>
<body>
<div class="app">
<header><div class="brand">JARVIS</div><div class="header-actions"><button id="clearChat" class="clear-chat" type="button">پاک‌کردن گفتگو</button><div id="status" class="status">در حال اتصال…</div></div></header>
<main><section id="welcome" class="welcome"><h1>دستیار هوشمند شما</h1><p>اینجا شروع یک گفت‌وگوی تازه است. سؤالت را بنویس یا با میکروفون صحبت کن.</p><div class="suggestions"><button class="suggestion" data-prompt="چند ایده خلاقانه برای ساخت بازی روبلاکس بده">🎮 ایده برای بازی</button><button class="suggestion" data-prompt="هوش مصنوعی را ساده توضیح بده">🧠 درباره هوش مصنوعی</button><button class="suggestion" data-prompt="یک حقیقت علمی جالب بگو">🚀 حقیقت علمی جالب</button></div></section><section id="messages" class="messages"></section></main>
<div class="composer"><div class="composer-inner"><button id="mic" title="شروع صحبت">🎙️</button><button id="langToggle" title="تغییر زبان تشخیص گفتار">فا</button><button id="voiceToggle" class="voice-active" title="خاموش‌کردن صدای پاسخ‌ها">🔊</button><textarea id="input" rows="1" placeholder="پیامت را بنویس…"></textarea><button id="send" class="send">➤</button></div><div class="hint">JARVIS • تشخیص گفتار از طریق سرور</div></div>
</div>
<script>
const $=id=>document.getElementById(id), input=$("input"), list=$("messages"), welcome=$("welcome"), status=$("status"), send=$("send"), mic=$("mic"), voiceToggle=$("voiceToggle"), langToggle=$("langToggle");
let voiceEnabled=true;
let speechLanguage="fa-IR";
function speakReply(text){
 if(!voiceEnabled || !("speechSynthesis" in window))return;
 window.speechSynthesis.cancel();
 const clean=String(text).replace(/```[\s\S]*?```/g,"کد").replace(/https?:\/\/\S+/g,"لینک");
 const utterance=new SpeechSynthesisUtterance(clean);
 utterance.lang=/[\u0600-\u06FF]/.test(clean)?"fa-IR":"en-US";
 utterance.rate=1;utterance.pitch=1;
 window.speechSynthesis.speak(utterance);
}
voiceToggle.onclick=()=>{
 voiceEnabled=!voiceEnabled;
 voiceToggle.textContent=voiceEnabled?"🔊":"🔇";
 voiceToggle.classList.toggle("voice-active",voiceEnabled);
 voiceToggle.title=voiceEnabled?"صدای پاسخ‌ها روشن است":"صدای پاسخ‌ها خاموش است";
 if(!voiceEnabled && "speechSynthesis" in window)window.speechSynthesis.cancel();
};
langToggle.onclick=()=>{
 speechLanguage=speechLanguage==="fa-IR"?"en-US":"fa-IR";
 langToggle.textContent=speechLanguage==="fa-IR"?"فا":"EN";
 langToggle.title=speechLanguage==="fa-IR"?"تشخیص گفتار فارسی":"Speech recognition: English";
};
const STORAGE_KEY="jarvis_ir_chat_history_v1";
const messages=[];
function saveHistory(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(messages.slice(-40)))}catch(e){console.warn("Chat history could not be saved",e)}
}
function add(role,text,scroll=true){
 welcome.style.display="none";
 const e=document.createElement("div");e.className="msg "+(role==="user"?"user":"ai");e.textContent=text;list.appendChild(e);
 if(scroll)e.scrollIntoView({behavior:"smooth"});
}
function restoreHistory(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  if(!Array.isArray(saved))return;
  for(const item of saved.slice(-40)){
   if(item&&["user","assistant"].includes(item.role)&&typeof item.content==="string"&&item.content.trim()){
    messages.push({role:item.role,content:item.content.slice(0,8000)});
    add(item.role,item.content,false);
   }
  }
  if(messages.length)list.lastElementChild?.scrollIntoView();
 }catch(e){console.warn("Saved chat history could not be loaded",e)}
}
function clearHistory(){
 if(!confirm("گفتگوی ذخیره‌شده پاک شود؟"))return;
 messages.length=0;list.replaceChildren();welcome.style.display="";
 try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
}
function localReply(raw){
 const s=raw.trim().toLowerCase();
 const has=(...words)=>words.some(w=>s.includes(w));
 if(/^(hi|hello|hey|سلام|درود|سلام جارویس|سلام جارويس)[!.؟? ]*$/.test(s) || has("سلام جارویس","سلام جارويس"))
   return has("hello","hi","hey") && !has("سلام") ? "Hello! I'm JARVIS. I can answer simple questions locally without an API key." : "سلام! من جارویس هستم 🤖 فعلاً در حالت رایگان و ساده کار می‌کنم. چه کمکی از دستم برمیاد؟";
 if(has("اسم تو چیه","اسمت چیه","تو کی هستی","who are you","your name"))
   return "من JARVIS هستم؛ دستیار ساده‌ای که بدون کلید API کار می‌کنه.";
 if(has("چه کار","چیکار","چه کمکی","help","قابلیت"))
   return "می‌تونم به سلام و احوال‌پرسی، چند سؤال عمومی و محاسبات ساده جواب بدم. این نسخه از مدل هوش مصنوعی پیشرفته استفاده نمی‌کنه و جواب‌هام محدوده.";
 if(has("ممنون","مرسی","تشکر","thank you","thanks"))
   return "خواهش می‌کنم! هر وقت خواستی من اینجام. 🤖";
 if(has("خداحافظ","بای","فعلا","خدافظ","goodbye","bye"))
   return "خداحافظ! تا گفت‌وگوی بعدی. 👋";
 if(has("ساعت چنده","ساعت الان","what time is it","current time")){
   return "ساعت دستگاه شما: "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
 }
 if(has("امروز چندمه","تاریخ امروز","what is today's date","today's date")){
   return "تاریخ دستگاه شما: "+new Date().toLocaleDateString();
 }
 if(has("هوا چطوره","آب و هوا","weather"))
   return "در این نسخه به اینترنت و اطلاعات زندهٔ آب‌وهوا وصل نیستم؛ برای پیش‌بینی دقیق، برنامهٔ آب‌وهوا را بررسی کن.";
 if(has("جوک","joke"))
   return "چرا کامپیوتر خسته شد؟ چون تمام روز کار می‌کرد و هیچ‌وقت استراحت نمی‌گرفت! 😄";
 if(has("پایتخت ایران","capital of iran"))
   return "پایتخت ایران تهران است.";
 if(has("پایتخت فرانسه","capital of france"))
   return "پایتخت فرانسه پاریس است.";
 if(has("چطوری","حالت چطوره","خوبی","how are you"))
   return "ممنون که پرسیدی! من آماده‌ام کمکت کنم. تو چطوری؟";
 // Simple arithmetic: numbers and one arithmetic operator only.
 const m=s.match(/^\s*(-?\d+(?:\.\d+)?)\s*([+\-*/×÷])\s*(-?\d+(?:\.\d+)?)\s*[=?؟]?\s*$/);
 if(m){
   const a=Number(m[1]), b=Number(m[3]), op=m[2];
   if((op==="/"||op==="÷")&&b===0) return "تقسیم بر صفر تعریف نشده است.";
   const result=op==="+"?a+b:op==="-"?a-b:(op==="*"||op==="×")?a*b:a/b;
   return "جواب: "+result;
 }
 if(has("hello","hi","good morning","good evening"))
   return "Hello! I'm JARVIS. This is the free basic mode, so I can answer only a limited set of questions.";
 if(has("capital of spain")) return "The capital of Spain is Madrid.";
 if(has("capital of usa","capital of the united states")) return "The capital of the United States is Washington, D.C.";
 return "هنوز جواب این سؤال رو بلد نیستم. 🧠 این نسخهٔ رایگان و ساده است و از مدل هوش مصنوعی پیشرفته استفاده نمی‌کنه. می‌تونی سؤال ساده‌تری بپرسی یا یک محاسبه مثل 12 * 4 بنویسی.";
}
async function health(){
 status.textContent="● حالت رایگان";
 status.title="پاسخ‌های ساده در همین مرورگر تولید می‌شوند؛ API لازم نیست.";
}
async function ask(){
 const text=input.value.trim();if(!text)return;
 input.value="";add("user",text);send.disabled=true;
 const load=document.createElement("div");load.className="msg ai";load.textContent="یک لحظه…";list.appendChild(load);
 try{
   await new Promise(resolve=>setTimeout(resolve,180));
 const response = await fetch("/api/chat", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    message: text,
    history: messages.slice(0, -1).slice(-20)
  })
});

const data = await response.json().catch(() => ({}));
if (!response.ok) throw new Error(data.error || "AI request failed");

const reply = data.reply || data.answer;
if (typeof reply !== "string" || !reply.trim()) throw new Error("پاسخ خالی از سرور دریافت شد.");
  
   load.remove();messages.push({role:"user",content:text},{role:"assistant",content:reply});saveHistory();add("assistant",reply);speakReply(reply);
 }catch(e){load.className="msg ai error";load.textContent=e.message || "پاسخ آماده نشد. دوباره امتحان کن."}
 finally{send.disabled=false;input.focus()}
}
document.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;ask()});
$("clearChat").onclick=clearHistory;restoreHistory();
send.onclick=ask;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
let mediaRecorder=null, audioChunks=[];
async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
  alert("ضبط صدا در این مرورگر در دسترس نیست. مطمئن شو سایت با HTTPS باز شده است.");return;
 }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  let mimeType="";
  if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))mimeType="audio/webm;codecs=opus";
  else if(MediaRecorder.isTypeSupported("audio/ogg;codecs=opus"))mimeType="audio/ogg;codecs=opus";
  mediaRecorder=new MediaRecorder(stream,mimeType?{mimeType}:undefined);
  audioChunks=[];
  mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data)};
  mediaRecorder.onerror=()=>{stream.getTracks().forEach(t=>t.stop());mic.classList.remove("on");mic.textContent="🎙️";alert("هنگام ضبط صدا خطایی رخ داد.")};
  mediaRecorder.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());
   mic.classList.remove("on");mic.textContent="🎙️";mic.disabled=true;
   const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"});
   if(!blob.size){mic.disabled=false;return}
   const previous=mic.title;mic.title="در حال تبدیل صدا به متن…";status.textContent="● در حال تشخیص گفتار…";
   try{
    const lang=speechLanguage==="fa-IR"?"fa":"en";
    const response=await fetch("/transcribe?language="+lang,{method:"POST",headers:{"Content-Type":blob.type||"audio/webm"},body:blob,signal:AbortSignal.timeout(40000)});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||"تبدیل صدا به متن ناموفق بود.");
    if(!data.text)throw new Error("صدای واضحی تشخیص داده نشد؛ دوباره صحبت کن.");
    input.value=data.text;await ask();
   }catch(error){alert(error.name==="TimeoutError"||error.name==="AbortError"?"زمان پاسخ‌گویی تشخیص گفتار تمام شد. دوباره با یک پیام کوتاه امتحان کن.":(error.message||"تشخیص گفتار ناموفق بود."))}
   finally{mic.disabled=false;mic.title=previous;status.textContent="● متصل"}
  };
  mediaRecorder.start();
  mic.classList.add("on");mic.textContent="⏹️";mic.title="پایان ضبط و تبدیل گفتار";
 }catch(error){
  if(error.name==="NotAllowedError"||error.name==="PermissionDeniedError")alert("اجازهٔ استفاده از میکروفون داده نشده است. دسترسی میکروفون را برای این سایت فعال کن.");
  else alert("میکروفون در دسترس نیست: "+error.message);
 }
}
mic.onclick=()=>{
 if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop();
 else startRecording();
};
health();
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
